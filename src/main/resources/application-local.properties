#======================================= App Configuration =======================================
server.port=4081
spring.application.name=api-gateway
spring.main.web-application-type=reactive
spring.cloud.gateway.server.webflux.x-forwarded.enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.for-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.proto-enabled=true
spring.cloud.gateway.server.webflux.x-forwarded.host-append=false
spring.cloud.gateway.server.webflux.x-forwarded.port-append=false
spring.cloud.gateway.server.webflux.x-forwarded.proto-append=false

#spring.profiles.active=dev
#============================== Config Server Configuration ======================
#spring.config.import=optional:configserver:http://configs-service:8888/${application.name}/docker
spring.cloud.config.enabled=false

#=======================================App Details=======================================
application.title=Api Gateway
application.version=@project.version@
application.description=@project.description@
favourite.base.path=/api/v1
favourite.openapi.dev-url=http://localhost:4082
favourite.openapi.prod-url=https://www.favorite-collections.ng:4082

#======================JWT Secret Key Configuration==============================
app.jwt.secret.


#====================== RABBITMQ SETTINGS==============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:some_password}
app.rabbitmq.topic.exchange=favourite-notification-topic
app.rabbitmq.queue.name=favourite-notification

#======================Logging Configuration=======================================
logging.file.path=logs/
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.max-file-size=10MB

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

#======================Actuator Configuration=======================================
management.info.env.enabled=true
management.health.mail.enabled=false
info.app.name=Api Gateway Actuator
info.app.java.version=1.0
info.app.type=Api Gateway
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.jms.enabled=false
info.tags.environment=default-local
management.server.base-path=/
#management.server.port=1010
eureka.instance.non-secure-port-enabled=true
Server.ssl.enabled=false
spring.http.codec.max-in-memory-size=20MB
spring.boot.admin.client.instance.metadata.managementUrl=http://localhost:${server.port}/actuator
#spring.boot.admin.client.url=http://localhost:4083

#======================Eureka Configuration======================================
eureka.port=4080
eureka.client.serviceUrl.defaultZone=http://favourite:pa55word@localhost:${eureka.port}/eureka
eureka.instance.secure-port-enabled=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.metadata-map.startup= ${random.int}
eureka.client.registry-fetch-interval-seconds=5

#Routes Discovery Automatically
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
## http vs lb (load balancer)
## Discovery Service Route
# Access Via http://localhost:2024/eureka/web
spring.cloud.gateway.server.webflux.routes[0].id=api-gateway
spring.cloud.gateway.server.webflux.routes[0].uri=http://discovery-service:4080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/

## Discover Service Static Resources Route
spring.cloud.gateway.server.webflux.routes[1].id=api-gateway-static
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:4080
spring.cloud.gateway.server.webflux.routes[1].predicates[0].=Path=/eureka/**

spring.cloud.gateway.server.webflux.routes[2].id=api-gateway
spring.cloud.gateway.server.webflux.routes[2].uri=lb://api-gateway
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Path=/api-gateway/v3/api-docs

spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/user-service/**
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Path=/user-service/v3/api-docs

spring.cloud.gateway.server.webflux.routes[4].id=product-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/product-service/**
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Path=/product-service/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=notifications-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notifications-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/notifications-service/**
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Path=/notifications-service/v3/api-docs

#====================== Swagger =======================================
#http://localhost:4081/swagger-ui.html
#http://localhost:4081/webjars/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs

springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[0].name=Api Gateway

springdoc.swagger-ui.urls[1].url=/core/v3/api-docs
springdoc.swagger-ui.urls[1].name=Core-Service

springdoc.swagger-ui.urls[2].url=/main/v3/api-docs
springdoc.swagger-ui.urls[2].name=Main-Service

springdoc.swagger-ui.urls[3].url=/notifications/v3/api-docs
springdoc.swagger-ui.urls[3].name=notifications

#DATABASE SETTINGS
spring.datasource.url=jdbc:postgresql://localhost:5432/fc_default
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=favourite_admin
spring.datasource.password=allForOne
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.format_sql=true

##======================Cors Origin=======================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=false

spring.main.allow-bean-definition-overriding=true

